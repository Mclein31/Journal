<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f1eb"/>
      <stop offset="1" stop-color="#e7e0d5"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#adbfd3"/>
      <stop offset="1" stop-color="#93a6bb"/>
    </linearGradient>
  </defs>
  <!-- full-bleed background (maskable safe) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- shadow -->
  <ellipse cx="250" cy="420" rx="120" ry="16" fill="#97a6b8" opacity="0.35"/>
  <!-- tabs peeking out on the right -->
  <rect x="318" y="140" width="52" height="58" rx="12" fill="#a2bbd7"/>
  <rect x="318" y="208" width="52" height="58" rx="12" fill="#8ec5e8"/>
  <rect x="318" y="276" width="52" height="58" rx="12" fill="#f6c26b"/>
  <!-- page block -->
  <rect x="150" y="108" width="196" height="296" rx="14" fill="#fffaf1"/>
  <!-- cover -->
  <rect x="136" y="100" width="200" height="300" rx="18" fill="url(#cover)"/>
  <rect x="136" y="100" width="22" height="300" rx="10" fill="#7e90a4" opacity="0.55"/>
  <!-- four-point star (matches the ✦ wordmark) -->
  <path d="M247 168C253 210 263 222 303 228C263 234 253 246 247 288C241 246 231 234 191 228C231 222 241 210 247 168Z" fill="#fbf8f4"/>
  <!-- label line -->
  <rect x="196" y="320" width="102" height="10" rx="5" fill="#fff8f6" opacity="0.7"/>
</svg>
