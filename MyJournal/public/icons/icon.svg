<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde8e2"/>
      <stop offset="1" stop-color="#f6cfc6"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e59bb0"/>
      <stop offset="1" stop-color="#cf7f97"/>
    </linearGradient>
  </defs>
  <!-- full-bleed background (maskable safe) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- shadow -->
  <ellipse cx="250" cy="420" rx="120" ry="16" fill="#c98f86" opacity="0.35"/>
  <!-- tabs peeking out on the right -->
  <rect x="318" y="140" width="52" height="58" rx="12" fill="#f2879e"/>
  <rect x="318" y="208" width="52" height="58" rx="12" fill="#8ec5e8"/>
  <rect x="318" y="276" width="52" height="58" rx="12" fill="#f6c26b"/>
  <!-- page block -->
  <rect x="150" y="108" width="196" height="296" rx="14" fill="#fffaf1"/>
  <!-- cover -->
  <rect x="136" y="100" width="200" height="300" rx="18" fill="url(#cover)"/>
  <rect x="136" y="100" width="22" height="300" rx="10" fill="#b86a82" opacity="0.55"/>
  <!-- heart -->
  <path d="M247 286c-34-24-56-44-56-70 0-18 14-31 31-31 11 0 20 6 25 15 5-9 14-15 25-15 17 0 31 13 31 31 0 26-22 46-56 70z" fill="#fff8f6"/>
  <!-- label line -->
  <rect x="196" y="320" width="102" height="10" rx="5" fill="#fff8f6" opacity="0.7"/>
</svg>
